[package]
name    = "browser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The extension ABI wrapper — the ONLY RustCFML dependency.
rustcfml-module = { path = "../RustCFML/crates/rustcfml-module" }

# Obscura. Repo-relative path deps: this repo and the obscura fork must sit in
# the same tree (see "Building" in the README). They become git deps pinned to a
# tag once the outstanding render fixes are upstream — they are not yet, and
# building against stock obscura gives you a broken flex layout.
obscura-dom     = { path = "../../THIRDPARTY/obscura/crates/obscura-dom" }
obscura-net     = { path = "../../THIRDPARTY/obscura/crates/obscura-net" }
obscura-js      = { path = "../../THIRDPARTY/obscura/crates/obscura-js" }
obscura-browser = { path = "../../THIRDPARTY/obscura/crates/obscura-browser", features = ["render"] }
obscura-render  = { path = "../../THIRDPARTY/obscura/crates/obscura-render", features = ["paint"] }
# "render" is not optional in practice: without it the CDP server answers
# Page.captureScreenshot, Page.printToPDF and the whole screencast domain with
# "requires a build with the render feature". An agent connecting to us would
# find it could drive the page but never see it.
obscura-cdp     = { path = "../../THIRDPARTY/obscura/crates/obscura-cdp", features = ["render"] }

tokio       = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde_json  = "1"
# PNG decode only, for the ink-coverage post-condition.
image       = { version = "0.25", default-features = false, features = ["png"] }
url         = "2"
htmd = "0.5.5"

[profile.release]
opt-level = 3
# REQUIRED by obscura's anti-panic protocol: ops wrap their bodies in
# catch_unwind so a panic degrades to an error instead of unwinding into V8's
# FFI frame and aborting. panic="abort" turns every catchable op panic into a
# hard crash.
panic = "unwind"

# MANDATORY. obscura-render does not build against stock crates.io taffy 0.12.1:
# it needs set_calc_resolver, item_aspect_ratio_is_intrinsic and
# AlignItemsKeyword::Normal, none of which exist upstream. Cargo SILENTLY IGNORES
# a patch whose version matches but whose features do not (it warns and moves
# on), and the failure surfaces as a wall of type errors inside obscura-render.
[patch.crates-io]
taffy       = { path = "../../THIRDPARTY/obscura/vendor/taffy" }
cosmic-text = { path = "../../THIRDPARTY/obscura/vendor/cosmic-text" }
